name: CI

# 每次提 PR、或直接往 main 推代码时，自动跑一遍语法自检。
# 绿勾 = 所有 .py 文件语法没问题；红叉 = 哪里写坏了，服务可能起不来。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-check:
    name: Python 语法自检
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Python 3.12（与 Dockerfile 一致）
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 编译检查所有 .py 文件（有语法错误这步就会变红）
        run: python -m compileall -q .

  behavior-tests:
    name: 安全同步批行为守卫（PostgreSQL 16）
    runs-on: ubuntu-latest
    needs: syntax-check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 脚本只接受本机 disposable PostgreSQL，并会再创建/销毁随机测试数据库。
      KIWI_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Python 3.12（与 Dockerfile 一致）
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装运行依赖
        run: pip install -r requirements.txt

      - name: 运行既有开源回归脚本
        run: |
          python scripts/test_drawer_stability.py
          python scripts/test_gateway_tool_streaming.py
          python scripts/test_stream_capture.py
          python scripts/test_calendar_summary_generation.py
          python scripts/test_calendar_json_parser.py
          python scripts/test_mcp_recall.py
          python scripts/test_compression_reasoning.py
          python scripts/test_calendar_delete_atomicity.py
          python scripts/test_mcp_calendar_sections.py
          python scripts/test_calendar_period_guards.py
          python scripts/test_admin_panel_cache.py
          node scripts/test_calendar_period_defaults.mjs

      - name: 运行 S1-S6 永久真库行为守卫
        run: python scripts/test_kiwi_safety_sync.py
